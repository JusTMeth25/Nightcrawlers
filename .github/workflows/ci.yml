name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "25"

jobs:
  fe:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run --coverage
      - name: Build (production, real API)
        run: npm run build
        env:
          VITE_API_MOCK: "false"
      - name: No dev harness in the production build
        run: test ! -e dist/game-dev.html
      - name: npm audit (runtime dependencies, blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all dependencies, report only)
        run: npm audit || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fe-coverage
          path: FE/coverage/
          if-no-files-found: ignore
          retention-days: 14

  be:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # Testcontainers uses the runner's Docker daemon.
      - run: chmod +x mvnw && ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: be-reports
          path: |
            BE/target/site/jacoco/
            BE/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  tools:
    name: Tools tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      - run: node --test tools/sprites/sprites.test.mjs tools/sync-gamedata.test.mjs

  gamedata:
    name: Game data in sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node tools/sync-gamedata.mjs --check

  security:
    name: Security scans
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
      DEPENDENCY_CHECK_VERSION: "13.0.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo --entrypoint sh \
            "ghcr.io/gitleaks/gitleaks:v${GITLEAKS_VERSION}" -c \
            'git config --global --add safe.directory /repo &&
             gitleaks git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Cache the NVD database
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-
      # Without NVD_API_KEY the first NVD download is very slow (public rate limit).
      # OSS Index now requires an account: disabled, the NVD data is the source.
      - name: OWASP dependency-check (Maven, fails on CVSS >= 7)
        working-directory: BE
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp "org.owasp:dependency-check-maven:${DEPENDENCY_CHECK_VERSION}:check" \
            -DfailBuildOnCVSS=7 -DossindexAnalyzerEnabled=false -DretireJsAnalyzerEnabled=false \
            -DnodeAnalyzerEnabled=false -DnodeAuditAnalyzerEnabled=false \
            -Dformats=HTML,JSON ${NVD_API_KEY:+-DnvdApiKey="$NVD_API_KEY"}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: BE/target/dependency-check-report.*
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: End-to-end (production build)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE: >-
        docker compose -p nc-e2e --env-file e2e.env
        -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v7
      - name: Throwaway stack configuration
        run: |
          r() { openssl rand -hex 24; }
          {
            echo "DOMAIN=http://localhost"
            echo "PUBLIC_URL=http://localhost:8088"
            echo "HTTP_PORT=8088"
            echo "HTTPS_PORT=8443"
            echo "MAILPIT_UI_PORT=8025"
            echo "POSTGRES_PASSWORD=$(r)"
            echo "DB_OWNER_PASSWORD=$(r)"
            echo "DB_APP_PASSWORD=$(r)"
            echo "JWT_SECRET=$(r)$(r)"
            echo "IP_HASH_SALT=$(r)"
            echo "MAIL_FROM=Nightcrawlers <no-reply@localhost>"
          } > e2e.env
      - uses: docker/setup-buildx-action@v4
      - name: Build and start the stack
        run: $COMPOSE up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium webkit
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - name: Playwright (chromium, pixel7, iphone14)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8088
          MAILPIT_URL: http://localhost:8025
        run: npx playwright test
      - name: Stack logs
        if: failure()
        run: $COMPOSE logs --no-color > stack.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            stack.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v
