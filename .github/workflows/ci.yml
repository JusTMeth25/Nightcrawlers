name: CI

# Private repository: 2000 free Actions minutes per month. Jobs run only for the parts that
# changed, superseded runs are cancelled, e2e runs only for main (pushes and PRs), and the
# OWASP dependency-check runs weekly in dependency-check.yml.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "assets-src/**", ".github/dependabot.yml", ".github/workflows/dependency-check.yml"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "assets-src/**", ".github/dependabot.yml", ".github/workflows/dependency-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "25"

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fe: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.fe == 'true' }}
      be: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.be == 'true' }}
      tools: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.tools == 'true' }}
      gamedata: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.gamedata == 'true' }}
      e2e: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.e2e == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # Shared contracts and game data are used by both FE and BE: they run both.
          filters: |
            shared: &shared
              - FE/src/data/**
              - FE/src/shared/**
              - BE/src/main/resources/gamedata/**
              - tools/sync-gamedata.mjs
              - .github/workflows/ci.yml
            fe:
              - *shared
              - FE/**
            be:
              - *shared
              - BE/**
            tools:
              - tools/**
              - .github/workflows/ci.yml
            gamedata:
              - *shared
            e2e:
              - FE/**
              - BE/**
              - e2e/**
              - db/**
              - Caddyfile
              - docker-compose*.yml
              - .dockerignore
              - .github/workflows/ci.yml

  fe:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.fe == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run --coverage
      - name: Build (production, real API)
        run: npm run build
        env:
          VITE_API_MOCK: "false"
      - name: No dev harness in the production build
        run: test ! -e dist/game-dev.html
      - name: npm audit (runtime dependencies, blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all dependencies, report only)
        run: npm audit || true
      # artifacts share the 500 MB private storage quota with GHCR: only on failure
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fe-coverage
          path: FE/coverage/
          if-no-files-found: ignore
          retention-days: 7

  be:
    name: Backend
    needs: changes
    if: needs.changes.outputs.be == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # Testcontainers uses the runner's Docker daemon.
      - run: chmod +x mvnw && ./mvnw -B -ntp verify
      # artifacts share the 500 MB private storage quota with GHCR: only on failure
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: be-reports
          path: |
            BE/target/site/jacoco/
            BE/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  tools:
    name: Tools tests
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      - run: node --test tools/sprites/sprites.test.mjs tools/sync-gamedata.test.mjs

  gamedata:
    name: Game data in sync
    needs: changes
    if: needs.changes.outputs.gamedata == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node tools/sync-gamedata.mjs --check

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo --entrypoint sh \
            "ghcr.io/gitleaks/gitleaks:v${GITLEAKS_VERSION}" -c \
            'git config --global --add safe.directory /repo &&
             gitleaks git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1'

  e2e:
    name: End-to-end (production build)
    needs: changes
    # Only for main: pushes to main and pull requests targeting main.
    if: >-
      needs.changes.outputs.e2e == 'true' &&
      (github.ref == 'refs/heads/main' || github.base_ref == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE: >-
        docker compose -p nc-e2e --env-file e2e.env
        -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v7
      - name: Throwaway stack configuration
        run: |
          r() { openssl rand -hex 24; }
          {
            echo "DOMAIN=http://localhost"
            echo "PUBLIC_URL=http://localhost:8088"
            echo "HTTP_PORT=8088"
            echo "HTTPS_PORT=8443"
            echo "MAILPIT_UI_PORT=8025"
            echo "POSTGRES_PASSWORD=$(r)"
            echo "DB_OWNER_PASSWORD=$(r)"
            echo "DB_APP_PASSWORD=$(r)"
            echo "JWT_SECRET=$(r)$(r)"
            echo "IP_HASH_SALT=$(r)"
            echo "MAIL_FROM=Nightcrawlers <no-reply@localhost>"
          } > e2e.env
      - uses: docker/setup-buildx-action@v4
      - name: Build and start the stack
        run: $COMPOSE up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - name: Playwright (chromium, pixel7, iphone14)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8088
          MAILPIT_URL: http://localhost:8025
        run: npx playwright test
      - name: Stack logs
        if: failure()
        run: $COMPOSE logs --no-color > stack.log 2>&1 || true
      # artifacts share the 500 MB private storage quota with GHCR: only on failure
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            stack.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v
