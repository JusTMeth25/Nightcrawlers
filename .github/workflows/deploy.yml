name: Deploy

# After a green CI run on main, or by hand (Actions > Deploy > Run workflow).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Commit to deploy: the one CI tested, or the dispatched ref.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    name: Build ${{ matrix.image }} (linux/arm64)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: web
            context: .
            file: FE/Dockerfile
          - image: backend
            context: BE
            file: BE/Dockerfile
    steps:
      - name: Privacy contact is configured
        if: matrix.image == 'web'
        env:
          VITE_PRIVACY_EMAIL: ${{ vars.VITE_PRIVACY_EMAIL }}
        run: |
          if [ -z "$VITE_PRIVACY_EMAIL" ]; then
            echo "::error::Set the repository variable VITE_PRIVACY_EMAIL (privacy contact) before deploying."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${REPO,,}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          # one manifest per tag (no attestation manifests): untagged leftovers would use GHCR quota
          provenance: false
          sbom: false
          build-args: |
            VITE_PRIVACY_EMAIL=${{ vars.VITE_PRIVACY_EMAIL }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ env.DEPLOY_SHA }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to the VM
    needs: images
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    outputs:
      previous: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy compose stack and scripts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          tar czf - docker-compose.yml db/init ops | ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" 'tar xzf - -C /opt/nightcrawlers && chmod 755 /opt/nightcrawlers/ops/*.sh /opt/nightcrawlers/db/init/*.sh'
      - name: Previous good tag
        id: previous
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          tag="$(ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            'cat /opt/nightcrawlers/.last-good-tag 2>/dev/null || true' | tr -cd 'A-Za-z0-9_.-')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous good tag: ${tag:-none}"
      - name: Pull and start ${{ env.DEPLOY_SHA }} (rollback on failure)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # The job token can read the (private) packages while the job runs. It travels on stdin,
          # never on a command line, and the VM keeps no registry credential (logout at the end).
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "set -e
             docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null
             trap 'docker logout ghcr.io >/dev/null' EXIT
             IMAGE_PREFIX='ghcr.io/${REPO,,}' /opt/nightcrawlers/ops/deploy.sh '$DEPLOY_SHA'"
      - name: Public health check
        if: vars.PUBLIC_URL != ''
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors -o /dev/null "$PUBLIC_URL/"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy

  # Private GHCR storage is free up to 500 MB (shared with Actions artifacts): after a successful
  # deploy keep only the 3 newest versions of each image, plus the deployed and the previous good
  # tag (rollback target) even when older; delete everything else, untagged versions included.
  cleanup:
    name: Prune old GHCR versions
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      OWNER_TYPE: ${{ github.event.repository.owner.type }}
      REPO: ${{ github.event.repository.name }}
      PREVIOUS: ${{ needs.deploy.outputs.previous }}
      KEEP: "3"
    steps:
      - name: Delete old versions
        run: |
          scope=users
          [ "$OWNER_TYPE" = Organization ] && scope=orgs
          for image in web backend; do
            pkg="${REPO,,}-${image}"
            base="/${scope}/${OWNER}/packages/container/${pkg}/versions"
            # id, tags; newest first
            gh api --paginate "$base" \
              --jq '.[] | [.id, .created_at, ((.metadata.container.tags // []) | join(","))] | @tsv' \
              | sort -t$'\t' -k2,2r > versions.tsv
            n=0
            while IFS=$'\t' read -r id _ tags; do
              n=$((n + 1))
              if [ "$n" -le "$KEEP" ] || [[ ",$tags," == *",$DEPLOY_SHA,"* ]] \
                || { [ -n "$PREVIOUS" ] && [[ ",$tags," == *",$PREVIOUS,"* ]]; }; then
                echo "keep   $pkg $id ${tags:-<untagged>}"
              else
                echo "delete $pkg $id ${tags:-<untagged>}"
                gh api -X DELETE "$base/$id"
              fi
            done < versions.tsv
          done
