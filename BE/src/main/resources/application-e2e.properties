# End-to-end profile: Mailpit SMTP on localhost:1025, cookies over HTTP, high rate limits.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.cookies.secure=false

# High limits: Playwright runs many flows from one IP.
app.rate-limit.register.capacity=100000
app.rate-limit.login-ip.capacity=100000
app.rate-limit.login-account.capacity=100000
app.rate-limit.refresh-ip.capacity=100000
app.rate-limit.forgot-account.capacity=100000
app.rate-limit.forgot-ip.capacity=100000
app.rate-limit.reset-ip.capacity=100000
