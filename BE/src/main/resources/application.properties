spring.application.name=nightcrawlers

# --- Database: the application user has DML privileges only; Flyway migrates as the schema owner.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nightcrawlers}
spring.datasource.username=${DB_APP_USER}
spring.datasource.password=${DB_APP_PASSWORD}
spring.flyway.user=${DB_OWNER_USER}
spring.flyway.password=${DB_OWNER_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- HTTP
# Client IP from X-Forwarded-For only, and only when the TCP peer is a trusted proxy (Tomcat
# RemoteIpValve). RFC 7239 "Forwarded" is ignored. TRUSTED_PROXIES is a regex of proxy IPs;
# the default covers loopback and private (Docker) ranges. No backslashes: Spring treats
# them as escapes inside ${...}.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:127[.][0-9]+[.][0-9]+[.][0-9]+|10[.][0-9]+[.][0-9]+[.][0-9]+|192[.]168[.][0-9]+[.][0-9]+|172[.](1[6-9]|2[0-9]|3[0-1])[.][0-9]+[.][0-9]+|0:0:0:0:0:0:0:1|::1}
server.error.include-stacktrace=never
server.error.include-message=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# An unreachable SMTP relay must not mark the API as down (it would restart the container).
management.health.mail.enabled=false

# --- Mail (Brevo SMTP in production)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# --- Application
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl=PT15M
app.refresh.ttl=P30D
app.refresh.absolute-ttl=P90D
app.cors.allowed-origins=${ALLOWED_ORIGINS}
app.mail.from=${MAIL_FROM:Nightcrawlers <no-reply@localhost>}
app.frontend-url=${FRONTEND_URL}
app.ip-hash-salt=${IP_HASH_SALT}
app.cookies.secure=true

# --- Rate limits (requests per period); spec 4.5 / plan Task 8
app.rate-limit.register.capacity=5
app.rate-limit.register.period=PT1H
app.rate-limit.login-ip.capacity=10
app.rate-limit.login-ip.period=PT1M
app.rate-limit.login-account.capacity=10
app.rate-limit.login-account.period=PT15M
app.rate-limit.refresh-ip.capacity=30
app.rate-limit.refresh-ip.period=PT1M
app.rate-limit.forgot-account.capacity=3
app.rate-limit.forgot-account.period=PT1H
app.rate-limit.forgot-ip.capacity=10
app.rate-limit.forgot-ip.period=PT1H
app.rate-limit.reset-ip.capacity=10
app.rate-limit.reset-ip.period=PT1H
