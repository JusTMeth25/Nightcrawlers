validation.locale.required=Language is required.
validation.locale.unsupported=Unsupported language.

# Password rules
password.tooShort=The password must be at least {0,number,#} characters long.
password.tooLong=The password can have at most {0,number,#} characters.
password.common=The password is too common.
password.containsUsername=The password must not contain the username.
password.containsEmail=The password must not contain the email.

