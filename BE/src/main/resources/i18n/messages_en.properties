# API messages (English). UTF-8. Always formatted with MessageFormat: write '' for an apostrophe.

# Problem titles and details: <code>.title, optional <code>.detail
error.invalidData.title=Invalid data
error.invalidData.detail=One or more fields are invalid.
error.invalidPassword.title=Invalid data
error.invalidPassword.detail=The password does not meet the requirements.
error.usernameTaken.title=Username already taken
error.usernameTaken.detail=Choose another username.
error.accountLocked.title=Account temporarily locked
error.accountLocked.detail=Too many failed attempts. Try again in {0,number,#} seconds.
error.invalidCredentials.title=Invalid credentials
error.invalidCredentials.detail=Incorrect username, email or password.
error.notAuthenticated.title=Not authenticated
error.notAuthenticated.detail=Login required or session expired.
error.accessDenied.title=Access denied
error.invalidToken.title=Invalid or expired token
error.invalidToken.detail=The link is not valid, has already been used or has expired.
error.invalidSession.title=Invalid session
error.invalidSession.detail=The session has expired or is no longer valid. Log in again.
error.csrf.title=CSRF check failed
error.csrf.detail=Missing or invalid X-CSRF-Token header.
error.tooManyRequests.title=Too many requests
error.tooManyRequests.detail=Too many attempts. Try again in {0,number,#} seconds.
error.invalidPath.title=Bad request
error.invalidPath.detail=Invalid request path.
error.upgradeNotFound.title=Upgrade not found
error.upgradeNotFound.detail=The requested upgrade does not exist.
error.purchaseFailed.title=Purchase failed
error.purchaseFailed.detail=Your save was changed by another request. Try again.
error.emailNotVerifiedRipperdoc.title=Email not verified
error.emailNotVerifiedRipperdoc.detail=Confirm your email address to use the Ripperdoc.
error.emailNotVerifiedRuns.title=Email not verified
error.emailNotVerifiedRuns.detail=Confirm your email address to save your runs.
error.saveNotFound.title=Save not found
error.maxRank.title=Maximum rank reached
error.maxRank.detail=This upgrade is already at its maximum rank.
error.insufficientEurodollars.title=Not enough Eurodollars
error.insufficientEurodollars.detail=You need {0,number,#} €$ for the next rank.
error.characterLocked.title=Character not unlocked
error.characterLocked.detail=This character is not available yet.
error.checkpointTooFrequent.title=Checkpoint too frequent
error.checkpointTooFrequent.detail=Send at most one checkpoint per minute of play.
error.checkpointImplausible.title=Implausible checkpoint
error.checkpointImplausible.detail=The submitted progress does not match the length of the run.
error.runNotActive.title=Run not active
error.runNotActive.detail=The run has already ended.
error.runNotFound.title=Run not found
error.runNotFound.detail=The requested run does not exist.
error.wrongPassword.title=Wrong password
error.wrongPassword.detail=The password is not correct.
error.conflict.title=Conflict
error.conflict.detail=The request conflicts with existing data.
error.staleData.title=Conflict
error.staleData.detail=The data was changed by another request. Try again.
error.internal.title=Internal error
error.internal.detail=An unexpected error occurred.

# Spring's built-in errors, by HTTP status
error.http400.title=Bad request
error.http400.detail=The request is unreadable or invalid.
error.http404.title=Not found
error.http404.detail=The requested resource does not exist.
error.http405.title=Method not allowed
error.http405.detail=HTTP method not supported for this resource.
error.http406.title=Not acceptable
error.http406.detail=Response format not available.
error.http413.title=Request too large
error.http413.detail=The request body is too large.
error.http415.title=Unsupported media type
error.http415.detail=Content type not supported.

