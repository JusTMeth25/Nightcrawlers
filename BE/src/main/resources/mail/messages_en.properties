already-registered.preheader=Someone tried to sign up with your email address.
already-registered.heading=Registration attempt
already-registered.body=someone tried to sign up with your email address, which already has an account. If it was you and you do not remember the password, you can reset it.
already-registered.cta=Recover your password
already-registered.footnote=If it was not you, you can ignore this message: your account has not been changed.
