# reset-password
reset-password.subject=Reset your password - Nightcrawlers
reset-password.preheader=Password reset request for your Nightcrawlers account.
reset-password.heading=Reset your password
reset-password.body=we received a request to reset the password of your account. After the change, every open session will be closed for security.
reset-password.cta=Choose a new password
reset-password.footnote=The link expires in 30 minutes and works only once. If you did not ask for the reset, ignore this message: your password stays the same.

# already-registered
