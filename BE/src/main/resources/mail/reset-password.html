<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mail(
        'Richiesta di reimpostazione della password del tuo account Nightcrawlers.',
        'Reimposta la password',
        ~{::#content},
        'Scegli una nuova password',
        'Il link scade tra 30 minuti e funziona una sola volta. Se non hai chiesto tu il reset, ignora questo messaggio: la password resta invariata.')}">
<body>
<div id="content">
  <p style="margin:0 0 12px 0;">Ciao <strong style="color:#f5e663;" th:text="${username}">netrunner</strong>,</p>
  <p style="margin:0 0 12px 0;">abbiamo ricevuto una richiesta di reimpostazione della password del tuo account.
    Dopo il cambio, tutte le sessioni aperte verranno chiuse per sicurezza.</p>
</div>
</body>
</html>
