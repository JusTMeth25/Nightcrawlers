# Test profile: PostgreSQL comes from Testcontainers (@ServiceConnection); values below are test-only.
spring.flyway.user=test
spring.flyway.password=test
app.jwt.secret=test-only-jwt-secret-not-used-anywhere-else-0123456789
app.ip-hash-salt=test-only-salt
app.cors.allowed-origins=http://localhost:5173
app.frontend-url=http://localhost:5173
app.mail.from=Nightcrawlers <no-reply@nightcrawlers.test>
app.cookies.secure=true
spring.mail.host=localhost
spring.mail.port=1025

# Generous limits: many tests share one client IP. RateLimitIT lowers them in its own context.
app.rate-limit.register.capacity=100000
app.rate-limit.login-ip.capacity=100000
app.rate-limit.login-account.capacity=100000
app.rate-limit.refresh-ip.capacity=100000
app.rate-limit.forgot-account.capacity=100000
app.rate-limit.forgot-ip.capacity=100000
app.rate-limit.reset-ip.capacity=100000
