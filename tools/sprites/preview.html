<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Nightcrawlers — anteprima sprite</title>
    <style>
      body { margin: 0; padding: 16px; font: 13px ui-monospace, Consolas, monospace; background: #111; color: #ddd; }
      h2 { margin: 24px 0 8px; color: #f5e663; }
      .grid { display: flex; flex-wrap: wrap; gap: 8px; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; border: 1px solid #333; }
      .pair { display: flex; gap: 4px; }
      canvas { image-rendering: pixelated; }
      .dark { background: #05010d; }
      .light { background: #d8d8e0; }
      .meta { font-size: 11px; color: #999; }
    </style>
  </head>
  <body>
    <p>Ogni animazione in loop a 8 fps, su sfondo scuro e chiaro. Il punto rosso è il pivot (piedi).</p>
    <div id="root"></div>
    <script type="module">
      const ATLASES = ['heroes', 'enemies']
      const SCALE = 1
      const root = document.getElementById('root')
      const anims = []

      for (const name of ATLASES) {
        const json = await (await fetch(`/FE/public/assets/atlas/${name}.json?${Date.now()}`)).json()
        const img = new Image()
        img.src = `/FE/public/assets/atlas/${name}.png?${Date.now()}`
        await img.decode()
        const groups = new Map()
        for (const [frameName, f] of Object.entries(json.frames)) {
          const key = frameName.replace(/_\d+$/, '')
          if (!groups.has(key)) groups.set(key, [])
          groups.get(key)[Number(frameName.match(/_(\d+)$/)[1])] = f
        }
        const h2 = document.createElement('h2')
        h2.textContent = name
        const grid = document.createElement('div')
        grid.className = 'grid'
        root.append(h2, grid)
        for (const [key, frames] of [...groups].sort(([a], [b]) => a.localeCompare(b))) {
          const maxW = Math.max(...frames.map((f) => f.frame.w)) * SCALE
          const maxH = Math.max(...frames.map((f) => f.frame.h)) * SCALE
          const cell = document.createElement('div')
          cell.className = 'cell'
          const pair = document.createElement('div')
          pair.className = 'pair'
          const canvases = ['dark', 'light'].map((bg) => {
            const c = document.createElement('canvas')
            c.width = maxW * 2
            c.height = maxH + 4
            c.className = bg
            pair.append(c)
            return c
          })
          const label = document.createElement('div')
          label.textContent = key
          const meta = document.createElement('div')
          meta.className = 'meta'
          meta.textContent = `${frames.length} frame`
          cell.append(pair, label, meta)
          grid.append(cell)
          anims.push({ img, frames, canvases, maxW, maxH })
        }
      }

      let tick = 0
      setInterval(() => {
        for (const a of anims) {
          const f = a.frames[tick % a.frames.length]
          for (const c of a.canvases) {
            const ctx = c.getContext('2d')
            ctx.imageSmoothingEnabled = false
            ctx.clearRect(0, 0, c.width, c.height)
            // anchor every frame at the same feet point so the loop shows jitter, if any
            const px = c.width / 2, py = a.maxH + 2
            const x = px - f.pivot.x * f.frame.w * SCALE
            const y = py - f.pivot.y * f.frame.h * SCALE
            ctx.drawImage(a.img, f.frame.x, f.frame.y, f.frame.w, f.frame.h, x, y, f.frame.w * SCALE, f.frame.h * SCALE)
            ctx.fillStyle = 'red'
            ctx.fillRect(px - 1, py - 1, 3, 3)
          }
        }
        tick++
      }, 125)
    </script>
  </body>
</html>
